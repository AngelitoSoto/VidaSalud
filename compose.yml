services:
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - vidasalud-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms256m -Xmx512m"
    networks:
      - vidasalud-network
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: 'VidaSalud-Kafka-Cluster'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:29092'
      KAFKA_CLUSTERS_0_ZOOKEEPER: 'zookeeper:2181'
    networks:
      - vidasalud-network
    restart: unless-stopped

  # --- SERVICIOS RABBITMQ Y MICROSERVICIOS EXISTENTES ---
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - vidasalud-network
    restart: unless-stopped

  ms-vidasalud-appointments:
    build:
      context: ./ms-vidasalud-appointments
      dockerfile: Dockerfile
    container_name: ms-vidasalud-appointments
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - rabbitmq
      - kafka
    networks:
      - vidasalud-network
    restart: unless-stopped

  ms-vidasalud-catalog:
    build:
      context: ./ms-vidasalud-catalog
      dockerfile: Dockerfile
    container_name: ms-vidasalud-catalog
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
    networks:
      - vidasalud-network
    restart: unless-stopped

  ms-vidasalud-notify:
    build:
      context: ./ms-vidasalud-notify
      dockerfile: Dockerfile
    container_name: ms-vidasalud-notify
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - rabbitmq
      - kafka
    networks:
      - vidasalud-network
    restart: unless-stopped

  ms-vidasalud-admin:
    build:
      context: ./ms-vidasalud-admin
      dockerfile: Dockerfile
    container_name: ms-vidasalud-admin
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - rabbitmq
      - kafka
    networks:
      - vidasalud-network
    restart: unless-stopped

  ms-vidasalud-bff:
    build:
      context: ./ms-vidasalud-bff
      dockerfile: Dockerfile
    container_name: ms-vidasalud-bff
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - APPOINTMENTS_SERVICE_URL=http://ms-vidasalud-appointments:8081
      - CATALOG_SERVICE_URL=http://ms-vidasalud-catalog:8083
      - ADMIN_SERVICE_URL=http://ms-vidasalud-admin:8085
    depends_on:
      - ms-vidasalud-appointments
      - ms-vidasalud-catalog
      - ms-vidasalud-admin
    networks:
      - vidasalud-network
    restart: unless-stopped

networks:
  vidasalud-network:
    driver: bridge
